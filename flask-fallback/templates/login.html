<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelioControl — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1923;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a2535;
      border: 1px solid #2a3a50;
      border-radius: 8px;
      padding: 40px;
      width: 360px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }
    .logo h1 {
      color: #f5a623;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .logo p {
      color: #5a7a9a;
      font-size: 12px;
      margin-top: 4px;
    }
    label {
      display: block;
      color: #8aaac8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      background: #0f1923;
      border: 1px solid #2a3a50;
      border-radius: 4px;
      color: #c8dff0;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
    }
    input:focus { border-color: #f5a623; }
    button {
      width: 100%;
      padding: 11px;
      background: #f5a623;
      border: none;
      border-radius: 4px;
      color: #0f1923;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    button:hover { background: #e09510; }
    .footer {
      text-align: center;
      margin-top: 24px;
      color: #3a5a7a;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">&#9728;</div>
      <h1>HelioControl</h1>
      <p>Inverter Management System v2.4.1</p>
    </div>
    {% if error %}
    <div style="background:#2a1515;border:1px solid #5a2020;border-radius:4px;padding:10px 14px;margin-bottom:20px;color:#e07070;font-size:13px;">
      {{ error }}
    </div>
    {% endif %}
    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="admin" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
      <button type="submit">Sign In</button>
    </form>
    <div class="footer">
      HC-5000 &bull; S/N HC5K-2024-00847 &bull; &copy; 2024 HelioControl Ltd
    </div>
  </div>
</body>
</html>
