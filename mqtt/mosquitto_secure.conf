# REFERENCE ONLY — not mounted by any container.
# This file shows what a hardened MQTT broker config looks like for comparison
# with the intentionally-open mosquitto.conf used by the honeypot.
# Do not mount this file in docker-compose.yml; the honeypot needs allow_anonymous true.
#
# PRODUCTION-HARDENED CONFIG — use this to secure a real MQTT deployment
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwords
require_certificate false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
max_connections 100
message_size_limit 1048576
log_type warning
log_type error
log_dest file /mosquitto/log/mosquitto.log
connection_messages true