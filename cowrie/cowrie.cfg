# Cowrie SSH/Telnet honeypot — overrides for the HelioControl ICS theme.
# All unset keys fall through to the built-in defaults (cowrie.cfg.dist).

[honeypot]
# Fake hostname that matches our solar inverter persona
hostname = helio-ctrl-01

# Fake hardware fingerprint — looks like an ARM embedded Linux device
hardware_platform = armv7l
operating_system = GNU/Linux

# Use the userdb.txt whitelist — reject credentials not on the list,
# exactly like a real device would. Prevents instant accept on first attempt.
auth_class = UserDB

[ssh]
# Banner that matches a plausible embedded-Linux OpenSSH version
version = SSH-2.0-OpenSSH_7.9p1 Raspbian-10+deb10u2

[telnet]
# Also listen for Telnet — Mirai and similar IoT botnets scan port 23
enabled = true

[output_jsonlog]
# Write structured JSON events to a file so Promtail can read them.
# Cowrie's stdout uses Twisted's plain-text format which is not parseable
# as JSON; this plugin produces one JSON object per line with eventid,
# src_ip, username, password, etc. — exactly what the Grafana panels query.
enabled = true
logfile = var/log/cowrie/cowrie.json
