events {
    worker_connections 512;
}

http {
    # Structured JSON access log — captures TLS fingerprinting, timing, and all
    # request headers for research. Numeric fields are unquoted; strings use escape=json.
    log_format json_honeypot escape=json
        '{"time":"$time_iso8601",'
        '"connection":$connection,'
        '"src_ip":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_bytes":$request_length,'
        '"response_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"accept":"$http_accept",'
        '"accept_language":"$http_accept_language",'
        '"accept_encoding":"$http_accept_encoding",'
        '"content_type":"$http_content_type",'
        '"cookie":"$http_cookie",'
        '"tls_version":"$ssl_protocol",'
        '"tls_cipher":"$ssl_cipher",'
        '"ssl_session_id":"$ssl_session_id",'
        '"ssl_session_reused":"$ssl_session_reused"}';

    access_log /dev/stdout json_honeypot;
    error_log  /dev/stderr warn;

    # Match Flask's upload cap so firmware probes are logged by the app.
    client_max_body_size 5m;

    server {
        listen 80;
        server_name _;

        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Host              $host;

        location / {
            proxy_pass http://flask-honeypot:5000;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        # Accept old TLS versions because this is a fingerprinting honeypot.
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host              $host;

        location / {
            proxy_pass http://flask-honeypot:5000;
        }
    }
}
