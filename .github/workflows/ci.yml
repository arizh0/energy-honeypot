name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - run: |
          cd terraform
          terraform init -backend=false
          terraform validate
          terraform fmt -check

      - name: Lint Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install flake8 flask==3.1.0
          flake8 flask-fallback/app.py modbus-proxy/modbus_proxy.py mqtt/telemetry_generator.py mqtt/mqtt_watcher.py mqtt/mqtt_honeypot.py tests/ --max-line-length 120
          flake8 analysis/ --max-line-length 120 --ignore=E501
          python -m unittest discover -s tests

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: mqtt/Dockerfile.telemetry

      - name: Lint watcher Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: mqtt/Dockerfile.watcher

      - name: Lint honeypot Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: mqtt/Dockerfile.honeypot

      - name: Lint flask Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: flask-fallback/Dockerfile

      - name: Lint nginx Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: nginx/Dockerfile

      - name: Lint Modbus proxy Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: modbus-proxy/Dockerfile

  container-scan:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: Build telemetry image
        run: docker build -t telemetry:ci -f mqtt/Dockerfile.telemetry mqtt/

      - name: Scan telemetry with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "telemetry:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Build watcher image
        run: docker build -t watcher:ci -f mqtt/Dockerfile.watcher mqtt/

      - name: Scan watcher with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "watcher:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Build MQTT honeypot image
        run: docker build -t mqtt-honeypot:ci -f mqtt/Dockerfile.honeypot mqtt/

      - name: Scan MQTT honeypot with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "mqtt-honeypot:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Build nginx image
        run: docker build -t nginx-proxy:ci -f nginx/Dockerfile nginx/

      - name: Scan nginx with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "nginx-proxy:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Build Modbus proxy image
        run: docker build -t modbus-proxy:ci -f modbus-proxy/Dockerfile modbus-proxy/

      - name: Scan Modbus proxy with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "modbus-proxy:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Build flask image
        run: docker build -t flask-honeypot:ci -f flask-fallback/Dockerfile flask-fallback/

      - name: Scan flask with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "flask-honeypot:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore
